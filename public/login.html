<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LexSystem — Iniciar sesión</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="login-shell">
    <div class="login-card">
      <a href="/entrada.html" style="font-size:12px;color:var(--muted);text-decoration:none;">← Volver</a>
      <h1>Lex<span style="color:var(--gold)">System</span></h1>
      <p>Ingresá con tu cuenta de abogado / equipo del estudio.</p>

      <form id="login-form">
        <div class="error-msg" id="error-msg"></div>

        <div class="field">
          <label>CI (usuario)</label>
          <input type="text" id="ci" required autocomplete="username">
        </div>

        <div class="field">
          <label>Contraseña</label>
          <div class="pw-wrap">
            <input type="password" id="password" required autocomplete="current-password">
            <button type="button" class="pw-toggle" data-target="password">👁</button>
          </div>
        </div>

        <button class="btn gold" type="submit" style="width:100%;" id="submit-btn">Ingresar</button>
        <p style="text-align:center;font-size:13px;color:var(--muted);margin-top:16px;">
          ¿No tenés cuenta? <a href="/registro.html" style="color:var(--navy);font-weight:600;">Creá una acá</a>
        </p>
      </form>
    </div>
  </div>

  <script>
    document.querySelectorAll('.pw-toggle').forEach((btn) => {
      btn.addEventListener('click', () => {
        const input = document.getElementById(btn.dataset.target);
        input.type = input.type === 'password' ? 'text' : 'password';
      });
    });

    const form = document.getElementById('login-form');
    const errorMsg = document.getElementById('error-msg');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Ingresando…';

      const body = {
        ci: document.getElementById('ci').value.trim(),
        password: document.getElementById('password').value,
      };

      try {
        const res = await fetch('/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'No se pudo iniciar sesión');
        window.location.href = data.redirect;
      } catch (err) {
        errorMsg.textContent = err.message;
        errorMsg.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Ingresar';
      }
    });
  </script>
</body>
</html>
