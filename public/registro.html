<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LexSystem — Crear cuenta de abogado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="login-shell">
    <div class="login-card" style="max-width:420px;">
      <a href="/login.html" style="font-size:12px;color:var(--muted);text-decoration:none;">← Volver al login</a>
      <h1>Creá tu cuenta</h1>
      <p>Para abogados y equipo del estudio.</p>

      <form id="registro-form">
        <div class="error-msg" id="error-msg"></div>

        <div class="field">
          <label>Nombre y apellidos</label>
          <input type="text" id="nombre" required>
        </div>

        <div class="field">
          <label>CI (será tu usuario para iniciar sesión)</label>
          <input type="text" id="ci" required>
        </div>

        <div class="field">
          <label>Correo electrónico</label>
          <input type="email" id="email" required>
        </div>

        <div class="field">
          <label>Número de teléfono</label>
          <input type="tel" id="telefono">
        </div>

        <div class="field">
          <label>Rol en el estudio</label>
          <select id="rol">
            <option value="abogado">Abogado</option>
            <option value="asistente">Asistente</option>
            <option value="socio">Socio</option>
          </select>
        </div>

        <div class="field">
          <label>Contraseña</label>
          <div class="pw-wrap">
            <input type="password" id="password" required minlength="6" autocomplete="new-password">
            <button type="button" class="pw-toggle" data-target="password">👁</button>
          </div>
          <div class="pw-strength">
            <div class="pw-strength-bar" id="bar1"></div>
            <div class="pw-strength-bar" id="bar2"></div>
            <div class="pw-strength-bar" id="bar3"></div>
          </div>
          <div class="pw-strength-label" id="strength-label">&nbsp;</div>
        </div>

        <div class="field">
          <label>Repetí la contraseña</label>
          <div class="pw-wrap">
            <input type="password" id="password2" required minlength="6" autocomplete="new-password">
            <button type="button" class="pw-toggle" data-target="password2">👁</button>
          </div>
          <div class="match-msg" id="match-msg">&nbsp;</div>
        </div>

        <button class="btn gold" type="submit" style="width:100%;" id="submit-btn">Crear cuenta</button>
      </form>
    </div>
  </div>

  <script>
    document.querySelectorAll('.pw-toggle').forEach((btn) => {
      btn.addEventListener('click', () => {
        const input = document.getElementById(btn.dataset.target);
        input.type = input.type === 'password' ? 'text' : 'password';
      });
    });

    // ----- medidor de fuerza: fácil / media / difícil -----
    const passwordInput = document.getElementById('password');
    const bars = [document.getElementById('bar1'), document.getElementById('bar2'), document.getElementById('bar3')];
    const strengthLabel = document.getElementById('strength-label');

    function evaluarFuerza(pw) {
      let puntos = 0;
      if (pw.length >= 8) puntos++;
      if (/[A-Z]/.test(pw) && /[a-z]/.test(pw)) puntos++;
      if (/[0-9]/.test(pw)) puntos++;
      if (/[^A-Za-z0-9]/.test(pw)) puntos++;

      if (pw.length === 0) return { nivel: 0, label: '\u00a0', color: 'var(--line)' };
      if (puntos <= 1) return { nivel: 1, label: 'Fácil', color: 'var(--red)' };
      if (puntos <= 3) return { nivel: 2, label: 'Media', color: 'var(--amber)' };
      return { nivel: 3, label: 'Difícil', color: 'var(--green)' };
    }

    function actualizarFuerza() {
      const { nivel, label, color } = evaluarFuerza(passwordInput.value);
      bars.forEach((bar, i) => { bar.style.background = i < nivel ? color : 'var(--line)'; });
      strengthLabel.textContent = label;
      strengthLabel.style.color = color;
      verificarCoincidencia();
    }
    passwordInput.addEventListener('input', actualizarFuerza);

    // ----- verificar que las dos contraseñas coincidan -----
    const password2Input = document.getElementById('password2');
    const matchMsg = document.getElementById('match-msg');

    function verificarCoincidencia() {
      if (password2Input.value.length === 0) {
        matchMsg.textContent = '\u00a0';
        matchMsg.className = 'match-msg';
        return true;
      }
      const coincide = passwordInput.value === password2Input.value;
      matchMsg.textContent = coincide ? 'Las contraseñas coinciden ✓' : 'Las contraseñas no coinciden';
      matchMsg.className = 'match-msg ' + (coincide ? 'ok' : 'error');
      return coincide;
    }
    password2Input.addEventListener('input', verificarCoincidencia);

    // ----- envío del formulario -----
    const form = document.getElementById('registro-form');
    const errorMsg = document.getElementById('error-msg');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.style.display = 'none';

      if (!verificarCoincidencia()) {
        errorMsg.textContent = 'Las contraseñas no coinciden';
        errorMsg.style.display = 'block';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Creando cuenta…';

      const body = {
        nombre: document.getElementById('nombre').value.trim(),
        ci: document.getElementById('ci').value.trim(),
        email: document.getElementById('email').value.trim(),
        telefono: document.getElementById('telefono').value.trim(),
        rol: document.getElementById('rol').value,
        password: passwordInput.value,
      };

      try {
        const res = await fetch('/auth/registro', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'No se pudo crear la cuenta');
        window.location.href = data.redirect;
      } catch (err) {
        errorMsg.textContent = err.message;
        errorMsg.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Crear cuenta';
      }
    });
  </script>
</body>
</html>
